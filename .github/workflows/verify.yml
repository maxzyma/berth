name: verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: macos-15
            node: 24
          - os: macos-15-intel
            node: 24
          - os: windows-2022
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux zsh lsof sqlite3 xvfb xauth libasound2t64 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm ci
      - run: npm run build
      - name: Unix runtime regression
        if: runner.os != 'Windows'
        run: node scripts/test.mjs
      - name: Windows activation boundary
        if: runner.os == 'Windows'
        run: node --test packages/vscode/dist-test/test/platform.test.js packages/vscode/dist-test/test/layoutIntro.test.js
      - name: Linux native editor integration
        if: runner.os == 'Linux' && matrix.node == 24
        run: xvfb-run -a npm run test:integration -w berth
