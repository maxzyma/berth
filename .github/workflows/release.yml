# Release on a version tag (vX.Y.Z, or vX.Y.Z-pre for a prerelease).
# npm publishing uses trusted publishing (OIDC): no token is stored anywhere,
# and npm adds a provenance attestation. The package's trusted publisher on
# npmjs.com names this repository and this workflow file.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub release
  id-token: write   # npm trusted publishing

jobs:
  release:
    # macOS: the tests drive tmux, BSD script(1) and zsh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: tmux
        run: brew install tmux

      - name: Tag matches the package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/vscode; do
            actual="$(node -p "require('./$p/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "::error::$p is $actual, tag is $GITHUB_REF_NAME"; exit 1
            fi
          done

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        working-directory: packages/core
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@berthdev/berth@$version" version >/dev/null 2>&1; then
            echo "@berthdev/berth@$version is already on npm; skipping publish"; exit 0
          fi
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --tag "$tag"

      - name: Package for the GitHub release
        run: |
          mkdir -p out
          (cd packages/core && npm pack --pack-destination ../../out)
          (cd packages/vscode && npx --yes @vscode/vsce@3 package --no-dependencies -o "../../out/berth-vscode-${GITHUB_REF_NAME#v}.vsix")

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --generate-notes $prerelease
